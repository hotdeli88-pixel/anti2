[project]
name = "saengibu-portal-backend"
version = "0.1.0"
description = "Backend for saengibu-portal (학교생활기록부 포털)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "google-auth>=2.35.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "typer>=0.12.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "freezegun>=1.5.0",
    "aiosqlite>=0.20.0",
]
ai = [
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "sentence-transformers>=3.2.0",
    "kiwipiepy>=0.18.0",
    "datasketch>=1.6.5",
    "pgvector>=0.3.0",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "casbin>=1.36.0",
    "casbin-sqlalchemy-adapter>=1.4.0",
]

[project.scripts]
saengibu = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
